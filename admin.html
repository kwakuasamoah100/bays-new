<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bays Restaurant | Admin Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .admin-card {
      max-width: 850px;
      margin: 20px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eeeeee;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .branch-select {
      padding: 8px 12px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #cccccc;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 2fr 1fr 3fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid #eeeeee;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .menu-row input {
      padding: 8px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .btn-delete {
      background: #e74c3c;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-delete:hover {
      background: #c0392b;
    }

    .btn-add {
      background: #3498db;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }

    .btn-add:hover {
      background: #2980b9;
    }

    .btn-download {
      background: #27ae60;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      width: 100%;
      margin-top: 25px;
    }

    .btn-download:hover {
      background: #219150;
    }

    .nav-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #555555;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-link:hover {
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <a href="index.html" class="nav-link">← Back to Customer Menu</a>

    <div class="header-bar">
      <h2>🍲 Bays Menu Manager</h2>
      <select id="branchSelector" class="branch-select" onchange="renderAdminBranchMenu()">
        <option value="Haatso">Haatso</option>
        <option value="Botwe">Botwe</option>
      </select>
    </div>

    <div id="adminMenuGrid">
      <p>Loading menu data...</p>
    </div>

    <button class="btn-add" onclick="addDishRow()">+ Add New Dish</button>
    <button class="btn-download" onclick="downloadUpdatedMenuJSON()">💾 Download Updated menu.json</button>
  </div>

  <script src="admin.js"></script>
</body>
</html>
